name: Deploy Power Platform Solution

on:
  push:
    branches: [main]
    paths:
      - 'solutions/**'
  workflow_dispatch:
    inputs:
      solution:
        description: 'Solution folder name (e.g., SnowlionBusinessApplication)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

env:
  SOLUTION_FOLDER: ${{ github.event.inputs.solution || 'SnowlionBusinessApplication' }}

jobs:
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.changes.outputs.solutions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed solutions
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- solutions/ | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "solutions=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed solutions: $CHANGED"

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.solutions != '[]')
    strategy:
      matrix:
        solution: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', github.event.inputs.solution)) || fromJson(needs.detect-changes.outputs.solutions) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PAC CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate to Power Platform
        run: |
          pac auth create \
            --applicationId ${{ secrets.PP_CLIENT_ID }} \
            --clientSecret ${{ secrets.PP_CLIENT_SECRET }} \
            --tenant ${{ secrets.PP_TENANT_ID }} \
            --environment ${{ secrets.PP_ENVIRONMENT_URL }}

      - name: Verify connection
        run: pac org who

      - name: Pack solution
        run: |
          pac solution pack \
            --folder ./solutions/${{ matrix.solution }} \
            --zipfile /tmp/${{ matrix.solution }}.zip \
            --processCanvasApps

      - name: Import solution
        run: |
          pac solution import \
            --path /tmp/${{ matrix.solution }}.zip \
            --force-overwrite true \
            --async true

      - name: Publish customizations
        run: pac solution publish

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Solution**: ${{ matrix.solution }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
