name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install PAC CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # NOTE: No pre-authentication here. Claude will authenticate itself
      # to the correct tenant based on the issue context and tenants.json.

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Bash(unzip:*)" "Bash(zip:*)" "Bash(mkdir:*)" "Bash(rm:*)" "Bash(find:*)" "Bash(sed:*)" "Bash(grep:*)" "Bash(cat:*)" "Bash(cp:*)" "Bash(mv:*)" "Bash(ls:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(cd:*)" "Bash(pac:*)" "Bash(dotnet:*)" "Bash(python3:*)" "Bash(export:*)" "Bash(curl:*)"'
        env:
          # Snowlion tenant credentials (maps existing secrets to prefixed env vars)
          SNOWLION_PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          SNOWLION_PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          SNOWLION_PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          SNOWLION_PP_ENVIRONMENT_URL: ${{ secrets.PP_ENVIRONMENT_URL }}
          SNOWLION_DATAVERSE_CONNECTION_ID: ${{ secrets.DATAVERSE_CONNECTION_ID }}
          SNOWLION_CONTENT_CONVERSION_CONNECTION_ID: ${{ secrets.CONTENT_CONVERSION_CONNECTION_ID }}
          # To add another tenant, add a new set of GitHub secrets and map them here:
          # {PREFIX}_PP_CLIENT_ID: ${{ secrets.{PREFIX}_PP_CLIENT_ID }}
          # {PREFIX}_PP_CLIENT_SECRET: ${{ secrets.{PREFIX}_PP_CLIENT_SECRET }}
          # {PREFIX}_PP_TENANT_ID: ${{ secrets.{PREFIX}_PP_TENANT_ID }}
          # {PREFIX}_PP_ENVIRONMENT_URL: ${{ secrets.{PREFIX}_PP_ENVIRONMENT_URL }}
          # {PREFIX}_DATAVERSE_CONNECTION_ID: ${{ secrets.{PREFIX}_DATAVERSE_CONNECTION_ID }}
          # {PREFIX}_CONTENT_CONVERSION_CONNECTION_ID: ${{ secrets.{PREFIX}_CONTENT_CONVERSION_CONNECTION_ID }}
