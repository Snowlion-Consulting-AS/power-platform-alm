name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install PAC CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Authenticate PAC CLI with Service Principal
        run: |
          pac auth create \
            --applicationId ${{ secrets.PP_CLIENT_ID }} \
            --clientSecret ${{ secrets.PP_CLIENT_SECRET }} \
            --tenant ${{ secrets.PP_TENANT_ID }} \
            --environment ${{ secrets.PP_ENVIRONMENT_URL }}
          pac org who

      - name: Create Dataverse Connection via REST API
        env:
          PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          PP_ENVIRONMENT_URL: ${{ secrets.PP_ENVIRONMENT_URL }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, uuid, os, sys

          client_id = os.environ['PP_CLIENT_ID']
          client_secret = os.environ['PP_CLIENT_SECRET']
          tenant_id = os.environ['PP_TENANT_ID']
          env_url = os.environ['PP_ENVIRONMENT_URL'].rstrip('/')

          # Step 1: Get token for PowerApps service (to create connection)
          token_data = urllib.parse.urlencode({
              'grant_type': 'client_credentials',
              'client_id': client_id,
              'client_secret': client_secret,
              'scope': 'https://service.powerapps.com/.default'
          }).encode()
          token_req = urllib.request.Request(
              f'https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token',
              data=token_data
          )
          powerapps_token = json.loads(urllib.request.urlopen(token_req).read())['access_token']
          print('Got PowerApps token')

          # Step 2: Get environment ID by listing environments via PowerApps API
          env_list_url = 'https://europe.api.powerapps.com/providers/Microsoft.PowerApps/environments?api-version=2016-11-01'
          env_list_req = urllib.request.Request(env_list_url)
          env_list_req.add_header('Authorization', f'Bearer {powerapps_token}')
          env_list_req.add_header('Accept', 'application/json')
          env_list_resp = json.loads(urllib.request.urlopen(env_list_req).read())

          env_id = None
          normalized_url = env_url.lower().rstrip('/')
          for env in env_list_resp.get('value', []):
              props = env.get('properties', {})
              linked = props.get('linkedEnvironmentMetadata', {})
              instance_url = linked.get('instanceUrl', '').lower().rstrip('/')
              if instance_url == normalized_url:
                  env_id = env['name']
                  break

          if not env_id:
              print(f'ERROR: Could not find environment matching {env_url}')
              print('Available environments:')
              for env in env_list_resp.get('value', []):
                  props = env.get('properties', {})
                  linked = props.get('linkedEnvironmentMetadata', {})
                  print(f'  {props.get("displayName", "?")} -> {linked.get("instanceUrl", "?")}')
              sys.exit(1)
          print(f'Environment ID: {env_id}')

          # Step 3: Check if a valid Dataverse SPN connection already exists
          list_url = f'https://europe.api.powerapps.com/providers/Microsoft.PowerApps/connections?api-version=2016-11-01&$filter=environment%20eq%20%27{env_id}%27'
          list_req = urllib.request.Request(list_url)
          list_req.add_header('Authorization', f'Bearer {powerapps_token}')
          list_req.add_header('Accept', 'application/json')
          list_resp = json.loads(urllib.request.urlopen(list_req).read())

          existing_conn_id = None
          for conn in list_resp.get('value', []):
              props = conn.get('properties', {})
              api_id = props.get('apiId', '')
              statuses = props.get('statuses', [])
              is_connected = any(s.get('status') == 'Connected' for s in statuses)
              if 'shared_commondataserviceforapps' in api_id and is_connected:
                  existing_conn_id = conn['name']
                  print(f'Found existing valid Dataverse connection: {existing_conn_id}')
                  break

          if not existing_conn_id:
              # Step 4: Create a new Dataverse connection via PUT
              connection_id = str(uuid.uuid4())
              create_url = f'https://europe.api.powerapps.com/providers/Microsoft.PowerApps/apis/shared_commondataserviceforapps/connections/{connection_id}?api-version=2016-11-01&%24filter=environment%20eq%20%27{env_id}%27'
              body = {
                  "properties": {
                      "environment": {
                          "id": f"/providers/Microsoft.PowerApps/environments/{env_id}",
                          "name": env_id
                      },
                      "connectionParametersSet": {
                          "name": "ServicePrincipalOauth",
                          "values": {
                              "token:clientId": {"value": client_id},
                              "token:clientSecret": {"value": client_secret},
                              "token:TenantId": {"value": tenant_id},
                              "token:grantType": {"value": "client_credentials"}
                          }
                      }
                  }
              }
              create_req = urllib.request.Request(create_url, data=json.dumps(body).encode(), method='PUT')
              create_req.add_header('Content-Type', 'application/json')
              create_req.add_header('Accept', 'application/json')
              create_req.add_header('Authorization', f'Bearer {powerapps_token}')
              try:
                  create_resp = json.loads(urllib.request.urlopen(create_req).read())
                  existing_conn_id = create_resp['name']
                  statuses = create_resp.get('properties', {}).get('statuses', [])
                  status_str = ', '.join(s.get('status', '?') for s in statuses)
                  print(f'Created Dataverse connection: {existing_conn_id} (status: {status_str})')
              except urllib.error.HTTPError as e:
                  print(f'Failed to create connection: {e.code} - {e.read().decode()[:500]}')
                  sys.exit(1)

          # Step 5: Write connection ID to env file for Claude to use
          conn_id_formatted = f'shared-commondataser-{existing_conn_id}'
          with open(os.environ.get('GITHUB_ENV', '/dev/null'), 'a') as f:
              f.write(f'DATAVERSE_CONNECTION_ID={conn_id_formatted}\n')
              f.write(f'PP_ENVIRONMENT_ID={env_id}\n')
          print(f'Exported DATAVERSE_CONNECTION_ID={conn_id_formatted}')
          print(f'Exported PP_ENVIRONMENT_ID={env_id}')
          PYEOF

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--allowedTools "Bash(unzip:*)" "Bash(zip:*)" "Bash(mkdir:*)" "Bash(rm:*)" "Bash(find:*)" "Bash(sed:*)" "Bash(grep:*)" "Bash(cat:*)" "Bash(cp:*)" "Bash(mv:*)" "Bash(ls:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(cd:*)" "Bash(pac:*)" "Bash(dotnet:*)" "Bash(python3:*)" "Bash(export:*)" "Bash(curl:*)"'
        env:
          PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          PP_ENVIRONMENT_URL: ${{ secrets.PP_ENVIRONMENT_URL }}
          DATAVERSE_CONNECTION_ID: ${{ env.DATAVERSE_CONNECTION_ID }}
          PP_ENVIRONMENT_ID: ${{ env.PP_ENVIRONMENT_ID }}
